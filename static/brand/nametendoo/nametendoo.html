<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nametendoo — Variante A: Liquid Flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Sora', sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .showcase {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 40px;
      gap: 16px;
    }

    .showcase.light {
      background: #ffffff;
    }

    .showcase.dark {
      background: #1F2937;
    }

    .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 20px;
      opacity: 0.4;
    }

    .light .label {
      color: #374151;
    }

    .dark .label {
      color: #9CA3AF;
    }

    /* === VARIANT A: LIQUID FLOW === */
    /* Concept: Flowing gradient that animates through the letters,
       each letter has a subtle stagger. Organic, alive, like the
       brand is breathing. Letters use variable tracking that
       tightens on hover for a magnetic feel. */

    .nametendoo {
      display: inline-flex;
      align-items: center;
      cursor: default;
      text-decoration: none;
    }

    .nametendoo img {
      height: 36px;
      width: 36px;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(22, 163, 74, 0.3));
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .nametendoo:hover img {
      transform: rotate(-8deg) scale(1.08);
    }

    .nametendoo-text {
      display: inline-flex;
      align-items: baseline;
      gap: 0;
      position: relative;
      margin-left: -3px;
    }

    .nametendoo-letter {
      display: inline-block;
      font-family: 'Sora', sans-serif;
      font-weight: 800;
      font-size: 1.4rem;
      line-height: 1;
      letter-spacing: -0.02em;
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
        letter-spacing 0.2s ease;
      cursor: default;
    }

    /* Light mode: animated green-to-teal gradient */
    .light .nametendoo-letter {
      background-image: linear-gradient(135deg,
          #15803d 0%,
          #16A34A 25%,
          #0d9488 50%,
          #0f766e 75%,
          #15803d 100%);
      animation: gradientFlow 4s ease infinite;
    }

    /* Dark mode: brighter, luminous version */
    .dark .nametendoo-letter {
      background-image: linear-gradient(135deg,
          #4ade80 0%,
          #34d399 25%,
          #2dd4bf 50%,
          #22d3ee 75%,
          #4ade80 100%);
      animation: gradientFlow 4s ease infinite;
    }

    /* Stagger the animation per letter */
    .nametendoo-letter:nth-child(1) {
      animation-delay: 0s;
    }

    .nametendoo-letter:nth-child(2) {
      animation-delay: 0.15s;
    }

    .nametendoo-letter:nth-child(3) {
      animation-delay: 0.3s;
    }

    .nametendoo-letter:nth-child(4) {
      animation-delay: 0.45s;
    }

    .nametendoo-letter:nth-child(5) {
      animation-delay: 0.6s;
    }

    .nametendoo-letter:nth-child(6) {
      animation-delay: 0.75s;
    }

    @keyframes gradientFlow {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    /* Hover: letter lifts with a spring, slight glow underneath */
    .nametendoo-letter:hover {
      transform: translateY(-3px) scale(1.12);
    }

    .light .nametendoo-letter:hover {
      filter: drop-shadow(0 4px 8px rgba(13, 148, 136, 0.35));
    }

    .dark .nametendoo-letter:hover {
      filter: drop-shadow(0 4px 12px rgba(74, 222, 128, 0.45));
    }

    /* Underline accent: a thin gradient line that appears on hover of the whole mark */
    .nametendoo-text::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      border-radius: 2px;
      transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .light .nametendoo-text::after {
      background: linear-gradient(90deg, #16A34A, #0d9488);
    }

    .dark .nametendoo-text::after {
      background: linear-gradient(90deg, #4ade80, #2dd4bf);
    }

    .nametendoo:hover .nametendoo-text::after {
      width: 100%;
    }

    /* === INLINE variant (for use inside headings) === */
    .nametendoo.inline {
      gap: 5px;
    }

    .nametendoo.inline img {
      height: 28px;
      width: 28px;
    }

    .nametendoo.inline .nametendoo-letter {
      font-size: inherit;
      font-weight: 800;
    }

    .sizes {
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: center;
    }

    h2.demo {
      font-family: 'Sora', sans-serif;
      font-weight: 600;
      font-size: 1.6rem;
    }

    .light h2.demo {
      color: #1f2937;
    }

    .dark h2.demo {
      color: #f3f4f6;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #d1d5db, transparent);
    }
  </style>
</head>

<body>

  <!-- LIGHT -->
  <div class="showcase light">
    <span class="label">Variante A — Liquid Flow / Fondo claro</span>
    <div class="sizes">
      <a class="nametendoo" href="#">
        <img src="../../brand/Atendoo_logo_barra_lateral_A_resaltado-removebg-preview_centrado.png" alt="">
        <span class="nametendoo-text">
          <span class="nametendoo-letter">t</span><span class="nametendoo-letter">e</span><span
            class="nametendoo-letter">n</span><span class="nametendoo-letter">d</span><span
            class="nametendoo-letter">o</span><span class="nametendoo-letter">o</span>
        </span>
      </a>

      <h2 class="demo">
        ¿Por qué
        <span class="nametendoo inline">
          <img src="../../brand/Atendoo_logo_barra_lateral_A_resaltado-removebg-preview_centrado.png" alt="">
          <span class="nametendoo-text">
            <span class="nametendoo-letter">t</span><span class="nametendoo-letter">e</span><span
              class="nametendoo-letter">n</span><span class="nametendoo-letter">d</span><span
              class="nametendoo-letter">o</span><span class="nametendoo-letter">o</span>
          </span>
        </span>?
      </h2>
    </div>
  </div>

  <div class="divider"></div>

  <!-- DARK -->
  <div class="showcase dark">
    <span class="label">Variante A — Liquid Flow / Fondo oscuro</span>
    <div class="sizes">
      <a class="nametendoo" href="#">
        <img src="../../brand/Atendoo_logo_barra_lateral_A_resaltado-removebg-preview_centrado.png" alt="">
        <span class="nametendoo-text">
          <span class="nametendoo-letter">t</span><span class="nametendoo-letter">e</span><span
            class="nametendoo-letter">n</span><span class="nametendoo-letter">d</span><span
            class="nametendoo-letter">o</span><span class="nametendoo-letter">o</span>
        </span>
      </a>

      <h2 class="demo">
        ¿Por qué
        <span class="nametendoo inline">
          <img src="../../brand/Atendoo_logo_barra_lateral_A_resaltado-removebg-preview_centrado.png" alt="">
          <span class="nametendoo-text">
            <span class="nametendoo-letter">t</span><span class="nametendoo-letter">e</span><span
              class="nametendoo-letter">n</span><span class="nametendoo-letter">d</span><span
              class="nametendoo-letter">o</span><span class="nametendoo-letter">o</span>
          </span>
        </span>?
      </h2>
    </div>
  </div>

</body>

</html>
