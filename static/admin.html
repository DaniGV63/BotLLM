<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BotLLM - Panel Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<!-- Login -->
<div id="login-section" class="flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm">
        <h1 class="text-2xl font-bold text-center mb-6">BotLLM Admin</h1>
        <div id="login-error" class="hidden bg-red-100 text-red-700 p-3 rounded mb-4 text-sm"></div>
        <input id="login-user" type="text" placeholder="Usuario" class="w-full p-3 border rounded mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input id="login-pass" type="password" placeholder="Contrasena" class="w-full p-3 border rounded mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500" onkeydown="if(event.key==='Enter')login()">
        <button onclick="login()" class="w-full bg-blue-600 text-white p-3 rounded hover:bg-blue-700 font-medium">Entrar</button>
    </div>
</div>

<!-- Dashboard -->
<div id="dashboard-section" class="hidden">
    <nav class="bg-white shadow-sm px-6 py-4 flex justify-between items-center">
        <div><span class="font-bold text-lg">BotLLM</span> <span id="nav-nombre" class="text-gray-500 ml-2"></span></div>
        <button onclick="logout()" class="text-red-600 hover:text-red-800 text-sm font-medium">Cerrar sesion</button>
    </nav>
    <div class="max-w-4xl mx-auto mt-6 px-4">
        <div class="flex border-b mb-6">
            <button onclick="showTab('datos')" id="tab-btn-datos" class="px-4 py-2 font-medium text-blue-600 border-b-2 border-blue-600">Datos</button>
            <button onclick="showTab('google')" id="tab-btn-google" class="px-4 py-2 font-medium text-gray-500 hover:text-gray-700">Google</button>
            <button onclick="showTab('conversaciones')" id="tab-btn-conversaciones" class="px-4 py-2 font-medium text-gray-500 hover:text-gray-700">Conversaciones</button>
        </div>
        <div id="msg-ok" class="hidden bg-green-100 text-green-700 p-3 rounded mb-4 text-sm"></div>
        <div id="msg-err" class="hidden bg-red-100 text-red-700 p-3 rounded mb-4 text-sm"></div>

        <!-- Tab: Datos -->
        <div id="tab-datos">
            <div class="bg-white rounded-lg shadow p-6 space-y-4">
                <h2 class="text-lg font-semibold mb-2">Datos del negocio</h2>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Nombre</label>
                    <input id="f-nombre" type="text" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Email notificaciones</label>
                    <input id="f-email" type="email" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex items-center gap-3">
                    <label class="text-sm font-medium text-gray-600">Bot activo</label>
                    <button id="f-bot-toggle" onclick="toggleBot()" class="w-12 h-6 rounded-full relative transition-colors duration-200">
                        <span class="block w-5 h-5 bg-white rounded-full shadow absolute top-0.5 transition-all duration-200"></span>
                    </button>
                </div>
                <button onclick="saveDatos()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 font-medium">Guardar</button>
            </div>
        </div>

        <!-- Tab: Google -->
        <div id="tab-google" class="hidden">
            <div class="bg-white rounded-lg shadow p-6 space-y-4">
                <h2 class="text-lg font-semibold mb-2">Credenciales Google</h2>
                <div id="google-status" class="text-sm p-3 rounded mb-2"></div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Calendar ID</label>
                    <input id="f-calendar-id" type="text" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500" placeholder="ejemplo@group.calendar.google.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Access Token</label>
                    <textarea id="f-access-token" rows="2" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 text-xs font-mono" placeholder="Dejar vacio para no modificar"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Refresh Token</label>
                    <textarea id="f-refresh-token" rows="2" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 text-xs font-mono" placeholder="Dejar vacio para no modificar"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Token Expiry</label>
                    <input id="f-token-expiry" type="text" readonly class="w-full p-2 border rounded bg-gray-50 text-gray-500">
                </div>
                <button onclick="saveGoogle()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 font-medium">Guardar</button>
            </div>
        </div>

        <!-- Tab: Conversaciones -->
        <div id="tab-conversaciones" class="hidden">
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-lg font-semibold mb-4">Conversaciones recientes</h2>
                <table class="w-full text-sm">
                    <thead><tr class="border-b text-left text-gray-500">
                        <th class="py-2 pr-4">Telefono</th><th class="py-2 pr-4">Nombre</th>
                        <th class="py-2 pr-4">Estado</th><th class="py-2 pr-4">Ultimo mensaje</th><th class="py-2"></th>
                    </tr></thead>
                    <tbody id="conv-table"></tbody>
                </table>
                <div id="conv-pagination" class="flex justify-between items-center mt-4 text-sm"></div>
            </div>
            <div id="messages-panel" class="hidden mt-4 bg-white rounded-lg shadow p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-semibold">Mensajes — <span id="msg-phone"></span></h3>
                    <button onclick="closeMessages()" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
                </div>
                <div id="messages-list" class="space-y-3 max-h-96 overflow-y-auto"></div>
            </div>
        </div>
    </div>
</div>

<script>
const API = window.location.origin;
let token = sessionStorage.getItem('admin_token');
let botActivo = false;

async function apiCall(method, path, body) {
    const opts = { method, headers: {} };
    if (token) opts.headers['Authorization'] = 'Bearer ' + token;
    if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    const res = await fetch(API + path, opts);
    if (res.status === 401) { logout(); throw new Error('No autorizado'); }
    if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.detail || 'Error del servidor'); }
    return res.json();
}
function showMsg(type, text) {
    const ok = document.getElementById('msg-ok'), err = document.getElementById('msg-err');
    ok.classList.add('hidden'); err.classList.add('hidden');
    const el = type === 'ok' ? ok : err;
    el.textContent = text; el.classList.remove('hidden');
    setTimeout(() => el.classList.add('hidden'), 4000);
}

async function login() {
    const user = document.getElementById('login-user').value.trim();
    const pass = document.getElementById('login-pass').value;
    const errEl = document.getElementById('login-error');
    errEl.classList.add('hidden');
    try {
        const data = await apiCall('POST', '/admin/login', { username: user, password: pass });
        token = data.access_token; sessionStorage.setItem('admin_token', token); showDashboard();
    } catch (e) { errEl.textContent = e.message; errEl.classList.remove('hidden'); }
}
function logout() {
    token = null; sessionStorage.removeItem('admin_token');
    document.getElementById('login-section').classList.remove('hidden');
    document.getElementById('dashboard-section').classList.add('hidden');
}

async function showDashboard() {
    document.getElementById('login-section').classList.add('hidden');
    document.getElementById('dashboard-section').classList.remove('hidden');
    await loadTenant(); showTab('datos');
}
async function loadTenant() {
    const t = await apiCall('GET', '/admin/tenant');
    document.getElementById('nav-nombre').textContent = '— ' + t.nombre_negocio;
    document.getElementById('f-nombre').value = t.nombre_negocio;
    document.getElementById('f-email').value = t.email_notificaciones;
    botActivo = t.bot_activo; updateBotToggle();
    document.getElementById('f-calendar-id').value = t.google_calendar_id || '';
    document.getElementById('f-token-expiry').value = t.google_token_expiry
        ? new Date(t.google_token_expiry).toLocaleString('es-ES') : 'Sin configurar';
    const s = document.getElementById('google-status');
    s.textContent = t.has_google_credentials ? 'Credenciales configuradas' : 'Sin credenciales Google configuradas';
    s.className = 'text-sm p-3 rounded mb-2 ' + (t.has_google_credentials ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700');
}

function showTab(name) {
    ['datos', 'google', 'conversaciones'].forEach(t => {
        document.getElementById('tab-' + t).classList.toggle('hidden', t !== name);
        const btn = document.getElementById('tab-btn-' + t);
        btn.className = t === name
            ? 'px-4 py-2 font-medium text-blue-600 border-b-2 border-blue-600'
            : 'px-4 py-2 font-medium text-gray-500 hover:text-gray-700';
    });
    if (name === 'conversaciones') loadConversations(1);
}

function toggleBot() { botActivo = !botActivo; updateBotToggle(); }
function updateBotToggle() {
    const btn = document.getElementById('f-bot-toggle'), dot = btn.querySelector('span');
    btn.className = 'w-12 h-6 rounded-full relative transition-colors duration-200 ' + (botActivo ? 'bg-green-500' : 'bg-gray-300');
    dot.style.left = botActivo ? '26px' : '2px';
}

async function saveDatos() {
    try {
        await apiCall('PUT', '/admin/tenant', {
            nombre_negocio: document.getElementById('f-nombre').value.trim(),
            email_notificaciones: document.getElementById('f-email').value.trim(),
            bot_activo: botActivo,
        });
        await loadTenant(); showMsg('ok', 'Datos guardados correctamente');
    } catch (e) { showMsg('err', e.message); }
}
async function saveGoogle() {
    const body = { google_calendar_id: document.getElementById('f-calendar-id').value.trim() };
    const at = document.getElementById('f-access-token').value.trim();
    const rt = document.getElementById('f-refresh-token').value.trim();
    if (at) body.google_access_token = at;
    if (rt) body.google_refresh_token = rt;
    try {
        await apiCall('PUT', '/admin/tenant', body);
        document.getElementById('f-access-token').value = '';
        document.getElementById('f-refresh-token').value = '';
        await loadTenant(); showMsg('ok', 'Credenciales Google guardadas');
    } catch (e) { showMsg('err', e.message); }
}

async function loadConversations(page) {
    try {
        const data = await apiCall('GET', `/admin/conversations?page=${page}&page_size=15`);
        const tbody = document.getElementById('conv-table');
        if (!data.conversations.length) {
            tbody.innerHTML = '<tr><td colspan="5" class="py-4 text-center text-gray-400">Sin conversaciones</td></tr>';
        } else {
            tbody.innerHTML = data.conversations.map(c => {
                const badge = c.estado === 'ACTIVA' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500';
                return `<tr class="border-b hover:bg-gray-50">
                    <td class="py-2 pr-4 font-mono">${c.wa_phone}</td>
                    <td class="py-2 pr-4">${c.nombre_paciente || '—'}</td>
                    <td class="py-2 pr-4"><span class="px-2 py-0.5 rounded-full text-xs font-medium ${badge}">${c.estado}</span></td>
                    <td class="py-2 pr-4 text-gray-500">${new Date(c.ultimo_mensaje_at).toLocaleString('es-ES')}</td>
                    <td class="py-2"><button onclick="viewMessages('${c.id}','${c.wa_phone}')" class="text-blue-600 hover:text-blue-800 text-xs font-medium">Ver</button></td>
                </tr>`;
            }).join('');
        }
        const tp = Math.ceil(data.total / data.page_size) || 1;
        document.getElementById('conv-pagination').innerHTML = `
            <span class="text-gray-500">${data.total} conversaciones</span>
            <div class="space-x-2">
                <button onclick="loadConversations(${page-1})" ${page<=1?'disabled':''} class="px-3 py-1 rounded border ${page<=1?'text-gray-300':'hover:bg-gray-100'}">Anterior</button>
                <span class="text-gray-500">${page} / ${tp}</span>
                <button onclick="loadConversations(${page+1})" ${page>=tp?'disabled':''} class="px-3 py-1 rounded border ${page>=tp?'text-gray-300':'hover:bg-gray-100'}">Siguiente</button>
            </div>`;
    } catch (e) { showMsg('err', e.message); }
}
async function viewMessages(convId, phone) {
    document.getElementById('msg-phone').textContent = phone;
    try {
        const data = await apiCall('GET', `/admin/conversations/${convId}/messages`);
        const list = document.getElementById('messages-list');
        list.innerHTML = data.messages.map(m => {
            const isUser = m.role === 'user';
            return `<div class="flex ${isUser ? 'justify-start' : 'justify-end'}">
                <div class="max-w-xs lg:max-w-md px-4 py-2 rounded-lg text-sm ${isUser ? 'bg-gray-200 text-gray-800' : 'bg-blue-600 text-white'}">
                    <p>${m.content}</p>
                    <div class="text-xs mt-1 ${isUser ? 'text-gray-400' : 'text-blue-200'}">${new Date(m.created_at).toLocaleTimeString('es-ES')}${m.intent ? ' — '+m.intent : ''}</div>
                </div></div>`;
        }).join('');
        document.getElementById('messages-panel').classList.remove('hidden');
        list.scrollTop = list.scrollHeight;
    } catch (e) { showMsg('err', e.message); }
}
function closeMessages() { document.getElementById('messages-panel').classList.add('hidden'); }

if (token) { showDashboard(); }
</script>
</body>
</html>
