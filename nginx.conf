upstream atendoo {
    server app:8000;
}

# Redirigir HTTP a HTTPS + challenge ACME para Certbot
server {
    listen 80;
    server_name atendoo.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name atendoo.app;

    ssl_certificate /etc/letsencrypt/live/atendoo.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atendoo.app/privkey.pem;

    # SSL best practices
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Headers de seguridad
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Archivos estáticos servidos por Nginx directamente
    # no-cache: browser siempre pregunta si cambió (304 si no, 200 con nuevo si sí)
    # Garantiza que cualquier deploy se ve inmediatamente sin hard refresh
    location /static/ {
        alias /app/static/;
        expires 0;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Landing page en la raíz
    location = / {
        rewrite ^ /landing/index.html last;
    }

    # /landing sin slash → añadir slash (evita que caiga al proxy)
    location = /landing {
        return 301 /landing/;
    }

    # /admin → panel de administración
    location = /admin {
        return 301 /static/admin.html;
    }

    # Privacy policy — URL canónica es /privacy.html
    location = /landing/privacy.html {
        return 301 /privacy.html;
    }

    # Landing page
    location /landing/ {
        alias /app/landing/;
        index index.html;
        expires 0;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Política de privacidad — servida directamente
    location = /privacy.html {
        alias /app/landing/privacy.html;
    }

    # Proxy a uvicorn
    location / {
        proxy_pass http://atendoo;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts generosos para llamadas LLM
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }
}
