name: atendoo

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: fisiobot
      POSTGRES_USER: fisiobot
      POSTGRES_PASSWORD: fisiobot_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
